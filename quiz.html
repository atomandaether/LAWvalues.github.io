<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link href="style.css" rel="stylesheet" type="text/css">
<link href="v2.css" rel="stylesheet" type="text/css">
<title>LAWvalues Quiz</title>
<link rel="icon" type="image/png" href="value_images/atomandaether.png">
</head>
<body>
<h1>LAWvalues</h1>
<hr>
<div class="site-links"><a href="instructions.html">Instructions</a> · <a href="methodology.html">Methodology</a></div>
<h2 style="text-align:center" id="question-number">Loading...</h2>
<div class="quiz-status"><span>Seven-point response scale</span><span id="saved-note" aria-live="polite"></span></div>
<div class="quiz-progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuenow="0" aria-valuemax="48"><div class="quiz-progress-fill" id="quiz-progress"></div></div>
<p class="question" id="question-text"></p>
<button class="button stronglyAgree" data-response="3">Strongly Agree</button><br>
<button class="button agree" data-response="2">Agree</button><br>
<button class="button slightlyAgree" data-response="1">Slightly Agree</button><br>
<button class="button neutral" data-response="0">Neither Agree nor Disagree</button><br>
<button class="button slightlyDisagree" data-response="-1">Slightly Disagree</button><br>
<button class="button disagree" data-response="-2">Disagree</button><br>
<button class="button stronglyDisagree" data-response="-3">Strongly Disagree</button><br>
<div class="quiz-nav">
    <button class="small_button" id="back_button" type="button">Back</button>
    <button class="small_button_off" id="back_button_off" type="button" disabled>Back</button>
    <button class="small_button skip-button" id="skip_button" type="button">Not sure / skip</button>
    <button class="small_button" id="restart_button" type="button">Restart</button>
</div>
<script src="axes.js"></script>
<script src="questions.js"></script>
<script src="scoring.js"></script>
<script src="quiz.js"></script>
</body>
</html>
