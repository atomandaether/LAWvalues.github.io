<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quiz — LAWvalues</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
  <script defer src="axes.js"></script>
  <script defer src="questions.js"></script>
  <script defer src="scoring.js"></script>
  <script defer src="quiz.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><img src="flag.png" alt="">LAWvalues</a>
      <nav class="site-nav" aria-label="Quiz navigation">
        <a class="nav-link" href="instructions.html">Instructions</a>
        <a class="nav-link" href="methodology.html">Methodology</a>
      </nav>
    </div>
  </header>

  <main class="narrow-shell quiz-page">
    <div class="quiz-topline">
      <p id="question-number">Question 1 of 48</p>
      <p id="saved-note" aria-live="polite"></p>
    </div>
    <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuenow="0" aria-valuemax="48">
      <div class="progress-fill" id="quiz-progress"></div>
    </div>

    <section class="question-card" aria-labelledby="question-text">
      <span class="eyebrow">Legal proposition</span>
      <p class="question-text" id="question-text">Loading question…</p>
    </section>

    <div class="response-grid" id="response-grid" aria-label="Response choices"></div>

    <div class="quiz-lower">
      <div class="quiz-controls">
        <button class="utility-button" id="back-button" type="button">Back</button>
        <button class="utility-button" id="restart-button" type="button">Restart</button>
      </div>
      <button class="utility-button skip-button" id="skip-button" type="button">Not sure / skip</button>
    </div>
  </main>
</body>
</html>
